<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101214">
<title>Manos AR</title>
<style>
:root{--bg:#101214;--ink:#f3efe9;--skin:#e3ad94;--mute:#a7a29b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#v,#c{position:fixed;inset:0;width:100%;height:100%}
#v{object-fit:cover}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;
  display:flex;justify-content:space-between;gap:10px;pointer-events:none}
#stat{background:rgba(16,18,20,.62);backdrop-filter:blur(8px);padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.35;min-height:20px}
#flip{pointer-events:auto;border:0;background:rgba(16,18,20,.62);color:var(--ink);padding:0 14px;height:38px;border-radius:12px;font:inherit;font-size:14px;backdrop-filter:blur(8px)}
#flip:focus-visible,#go:focus-visible{outline:2px solid var(--skin);outline-offset:2px}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:24px 22px calc(env(safe-area-inset-bottom,0px) + 28px);
  background:radial-gradient(120% 70% at 50% 0%,#2a2220 0%,var(--bg) 62%)}
#intro h1{font-size:40px;line-height:1.05;margin:0 0 12px;font-weight:700;letter-spacing:-.02em}
#intro p{margin:0 0 20px;color:var(--mute);font-size:16px;line-height:1.5;max-width:34ch}
#go{border:0;background:var(--skin);color:#26160f;font:inherit;font-weight:700;font-size:17px;height:54px;border-radius:16px;width:100%}
#err{color:#ff9d8a;font-size:14px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="hud"><div id="stat">Esperando cámara…</div><button id="flip" hidden>Girar cámara</button></div>
<div id="intro">
  <h1>Tus manos,<br>dentro de la escena</h1>
  <p>La cámara trasera detecta tus manos y las dibuja en 3D. Pellizca para agarrar las esferas, empújalas con la palma y lánzalas.</p>
  <button id="go">Activar cámara</button>
  <div id="err"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
const $ = id => document.getElementById(id);
const video = $('v'), stat = $('stat'), err = $('err');
let W = innerWidth, H = innerHeight;
let facing = 'environment', mirror = false, landmarker = null, running = false, result = null;

/* ---------- escena ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(0, W, 0, -H, 1, 4000);
cam.position.z = 2000;
scene.add(new THREE.AmbientLight(0xffffff, .55));
scene.add(new THREE.HemisphereLight(0xfff1e6, 0x40342e, .5));
const sun = new THREE.DirectionalLight(0xffffff, .9);
sun.position.set(-300, 700, 900);
scene.add(sun);
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H);
  cam.right = W; cam.bottom = -H; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- mano 3D ---------- */
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[9,10],[10,11],[11,12],
  [13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
const FAC = [1.3,1.15,1.0,.9,.8, 1.05,.9,.8,.7, 1.05,.92,.8,.7, 1.0,.88,.78,.68, .95,.8,.7,.6];
const skin = new THREE.MeshStandardMaterial({ color: 0xe3ad94, roughness: .5, metalness: 0, side: THREE.DoubleSide });
const UP = new THREE.Vector3(0, 1, 0), tmp = new THREE.Vector3();
const sphereGeo = new THREE.SphereGeometry(1, 16, 12);
const PALM = [0, 1, 5, 9, 13, 17];

class Hand {
  constructor() {
    this.g = new THREE.Group(); scene.add(this.g);
    this.p = Array.from({ length: 21 }, () => new THREE.Vector3());
    this.fresh = true; this.held = null; this.pinch = false; this.label = ''; this.u = 10;
    this.joints = FAC.map(() => { const m = new THREE.Mesh(sphereGeo, skin); this.g.add(m); return m; });
    this.bones = BONES.map(([a, b]) => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(FAC[b], FAC[a], 1, 16, 1, true), skin);
      this.g.add(m); return m;
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(18), 3));
    geo.setIndex([0,1,2, 0,2,3, 0,3,4, 0,4,5]);
    this.palm = new THREE.Mesh(geo, skin); this.palm.frustumCulled = false; this.g.add(this.palm);
  }
  set(target) {
    const k = this.fresh ? 1 : .55;
    this.p.forEach((v, i) => v.lerp(target[i], k));
    this.fresh = false;
    const p = this.p;
    const palmLen = p[0].distanceTo(p[9]);
    this.u = palmLen * .095;
    this.joints.forEach((m, i) => { m.position.copy(p[i]); m.scale.setScalar(this.u * FAC[i] * 1.02); });
    this.bones.forEach((m, i) => {
      const [a, b] = BONES[i];
      tmp.subVectors(p[b], p[a]);
      const len = tmp.length() || 1e-3;
      m.position.copy(p[a]).addScaledVector(tmp, .5);
      m.quaternion.setFromUnitVectors(UP, tmp.normalize());
      m.scale.set(this.u, len, this.u);
    });
    const pos = this.palm.geometry.attributes.position;
    PALM.forEach((idx, i) => pos.setXYZ(i, p[idx].x, p[idx].y, p[idx].z));
    pos.needsUpdate = true;
    this.palm.geometry.computeVertexNormals();
    this.g.visible = true;
  }
}
const hands = [];

function gesture(p) {
  const d = (i, j) => p[i].distanceTo(p[j]);
  const ext = [[8,6],[12,10],[16,14],[20,18]].map(([t, k]) => d(t, 0) > d(k, 0) * 1.08);
  const n = ext.filter(Boolean).length;
  if (n === 0) return 'Puño';
  if (n === 4) return 'Palma abierta';
  if (ext[0] && ext[1] && !ext[2] && !ext[3]) return 'Paz';
  if (ext[0] && n === 1) return 'Señalando';
  return n + ' dedos';
}

/* ---------- objetos con física ---------- */
const COLORS = [0xff4d6d, 0x4cc9f0, 0xf9c74f, 0x90be6d, 0xb5179e, 0xff9f1c];
const objs = COLORS.map(c => {
  const r = 38 + Math.random() * 26;
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 28),
    new THREE.MeshStandardMaterial({ color: c, roughness: .25, metalness: .35 }));
  m.scale.setScalar(r); scene.add(m);
  return { m, r, held: null,
    p: new THREE.Vector3(W * (.15 + .7 * Math.random()), -H * (.2 + .45 * Math.random()), 0),
    v: new THREE.Vector3((Math.random() - .5) * 90, (Math.random() - .5) * 90, 0) };
});

function release(h) { if (h.held) { h.held.held = null; h.held = null; } }

/* ---------- cámara y mapeo pantalla ---------- */
function toScreen(l) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
  const x = mirror ? 1 - l.x : l.x;
  return new THREE.Vector3((W - dw) / 2 + x * dw, -((H - dh) / 2 + l.y * dh), -l.z * dw);
}

function handleHands(dt) {
  const L = (result && result.landmarks) || [];
  while (hands.length < L.length) hands.push(new Hand());
  const names = [];
  hands.forEach((h, i) => {
    if (i >= L.length) { h.g.visible = false; h.fresh = true; release(h); return; }
    h.set(L[i].map(toScreen));
    const p = h.p, palm = p[0].distanceTo(p[9]);
    const dp = p[4].distanceTo(p[8]);
    h.pinch = h.pinch ? dp < palm * .45 : dp < palm * .32;
    const mid = tmp.addVectors(p[4], p[8]).multiplyScalar(.5).clone();
    h.mid = mid;
    if (h.pinch && !h.held) {
      let best = null, bd = 1e9;
      objs.forEach(o => {
        if (o.held) return;
        const d = Math.hypot(o.p.x - mid.x, o.p.y - mid.y);
        if (d < o.r + h.u * 3 && d < bd) { bd = d; best = o; }
      });
      if (best) { h.held = best; best.held = h; }
    }
    if (!h.pinch && h.held) release(h);
    if (h.held) {
      const o = h.held;
      o.v.set((mid.x - o.p.x) / Math.max(dt, .001), (mid.y - o.p.y) / Math.max(dt, .001), 0).clampLength(0, 2400);
      o.p.set(mid.x, mid.y, 0);
    }
    h.label = h.pinch ? 'Pellizco' : gesture(p);
    names.push('Mano ' + (i + 1) + ': ' + h.label);
    // empujar objetos con palma y yemas
    const c = new THREE.Vector3().add(p[0]).add(p[5]).add(p[17]).multiplyScalar(1 / 3);
    const pushers = [[c, palm * .5], ...[4, 8, 12, 16, 20].map(k => [p[k], h.u])];
    objs.forEach(o => {
      if (o.held) return;
      pushers.forEach(([q, r]) => {
        const dx = o.p.x - q.x, dy = o.p.y - q.y, d = Math.hypot(dx, dy) || 1e-3, min = o.r + r;
        if (d < min) {
          o.p.x += dx / d * (min - d); o.p.y += dy / d * (min - d);
          o.v.x += dx / d * 1100 * dt; o.v.y += dy / d * 1100 * dt;
        }
      });
    });
  });
  stat.textContent = names.length ? names.join('  ·  ') : 'Muestra tus manos a la cámara';
}

function physics(dt) {
  objs.forEach(o => {
    if (!o.held) {
      o.p.addScaledVector(o.v, dt);
      o.v.multiplyScalar(Math.pow(.55, dt));
      if (o.v.length() < 25) o.v.add(new THREE.Vector3((Math.random() - .5) * 40, (Math.random() - .5) * 40, 0).multiplyScalar(dt * 6));
      if (o.p.x < o.r) { o.p.x = o.r; o.v.x = Math.abs(o.v.x) * .8; }
      if (o.p.x > W - o.r) { o.p.x = W - o.r; o.v.x = -Math.abs(o.v.x) * .8; }
      if (o.p.y > -o.r) { o.p.y = -o.r; o.v.y = -Math.abs(o.v.y) * .8; }
      if (o.p.y < -(H - o.r)) { o.p.y = -(H - o.r); o.v.y = Math.abs(o.v.y) * .8; }
    }
    o.m.position.set(o.p.x, o.p.y, o.held && o.held.mid ? o.held.mid.z : 0);
  });
}

/* ---------- arranque ---------- */
async function initLandmarker() {
  if (landmarker) return;
  const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const { HandLandmarker, FilesetResolver } = await import(base + '/vision_bundle.mjs');
  const fs = await FilesetResolver.forVisionTasks(base + '/wasm');
  const model = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
  const make = delegate => HandLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: model, delegate }, runningMode: 'VIDEO', numHands: 2,
    minHandDetectionConfidence: .5, minHandPresenceConfidence: .5, minTrackingConfidence: .5 });
  try { landmarker = await make('GPU'); } catch (e) { landmarker = await make('CPU'); }
}

async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    throw new Error('Este navegador necesita una página HTTPS para usar la cámara.');
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.srcObject = stream;
  await video.play();
  mirror = facing === 'user';
  video.style.transform = mirror ? 'scaleX(-1)' : 'none';
  result = null;
}

$('go').onclick = async () => {
  err.textContent = '';
  $('go').disabled = true; $('go').textContent = 'Cargando modelo…';
  try {
    await initLandmarker();
    await startCam();
    running = true;
    $('intro').hidden = true; $('flip').hidden = false;
    stat.textContent = 'Muestra tus manos a la cámara';
  } catch (e) {
    err.textContent = e.name === 'NotAllowedError'
      ? 'Permiso de cámara denegado. Actívalo en los ajustes del navegador y vuelve a intentarlo.'
      : (e.message || String(e));
    $('go').disabled = false; $('go').textContent = 'Activar cámara';
  }
};
$('flip').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await startCam(); } catch (e) { stat.textContent = e.message; }
};

let last = performance.now(), lastT = -1;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - last) / 1000, .05); last = t;
  if (running && landmarker && video.readyState >= 2 && video.currentTime !== lastT) {
    lastT = video.currentTime;
    try { result = landmarker.detectForVideo(video, t); } catch (e) {}
  }
  if (running) handleHands(dt);
  physics(dt);
  renderer.render(scene, cam);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
